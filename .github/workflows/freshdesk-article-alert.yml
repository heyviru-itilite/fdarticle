name: Freshdesk article alert

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports a minimum five-minute schedule. Runs can be delayed.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: freshdesk-article-alert
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FRESHDESK_DOMAIN: ${{ vars.FRESHDESK_DOMAIN }}
      FRESHDESK_PUBLIC_PORTAL_URL: ${{ vars.FRESHDESK_PUBLIC_PORTAL_URL }}
      FRESHDESK_CUSTOMER_PORTAL_ID: ${{ vars.FRESHDESK_CUSTOMER_PORTAL_ID }}
      FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      ALERT_EXISTING_ON_FIRST_RUN: "false"
      ALERT_STATE_PATH: data/state.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Poll Freshdesk and alert Google Chat
        run: python app.py --once

      - name: Persist alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update Freshdesk alert state"
            git push
          fi

